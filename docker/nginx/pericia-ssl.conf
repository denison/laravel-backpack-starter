# Arquivo usado somente no perfil de producao (nginx) com HTTPS.
# Quando criar um projeto real:
# 1. renomeie este arquivo para algo do projeto, ex: app-ssl.conf;
# 2. troque o server_name pelo dominio do projeto;
# 3. troque os caminhos /etc/letsencrypt/live/... para o mesmo dominio;
# 4. atualize docker/nginx/Dockerfile.nginx para copiar o novo nome.
server {
  listen 443 ssl http2;
  server_name expert.kpfengenharia.com.br;

  # Mesmo root do :80
  root /var/www/public;
  index index.php;

  # Certificados Let's Encrypt (montados do host em /etc/letsencrypt)
  ssl_certificate     /etc/letsencrypt/live/expert.kpfengenharia.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/expert.kpfengenharia.com.br/privkey.pem;

  # Básico seguro
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  # Limites (iguais ao :80 que você usa)
  client_max_body_size 51g;
  client_body_buffer_size 512k;
  client_body_in_file_only clean;

  # Reverb WebSocket (cliente -> Nginx:443 -> app:8080)
  location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://app:8080;
  }

  # PHP (ajuste o nome/porta se seu FPM for diferente)
  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # AVISA O LARAVEL QUE A REQUISIÇÃO É HTTPS
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
  }

  # Roteamento Laravel
  location / {
    try_files $uri $uri/ /index.php?$query_string;
    gzip_static on;
  }

  error_log  /var/log/nginx/error.log;
  access_log /var/log/nginx/access.log;
}
